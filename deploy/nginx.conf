server {
  listen 80;
  server_name _;
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = / {
    return 302 /docs/;
  }

  # Examples: static Vite SPA built with base=/examples/
  location = /examples {
    return 301 /examples/;
  }

  location /examples/assets/ {
    alias /app/examples/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /examples/ {
    alias /app/examples/;
    try_files $uri $uri/ /examples/index.html;
  }

  # Docs: Nuxt/Nitro server built with baseURL=/docs/ (path is passed through as-is)
  location /docs {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
